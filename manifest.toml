#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2
id = "fcaptcha"
name = "FCaptcha"
description.en = "Self-hosted CAPTCHA and token verification for websites and forms"
description.fr = "CAPTCHA et vérification de jetons auto-hébergés pour les sites et formulaires"
version = "1.52.0~ynh1"
maintainers = ["cport1"]

[upstream]
license = "MIT"
website = "https://webdecoy.com/product/fcaptcha/"
demo = "https://webdecoy.com/product/fcaptcha-demo/"
admindoc = "https://docs.webdecoy.com/fcaptcha/quickstart/"
code = "https://github.com/WebDecoy/FCaptcha"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "1G"
ram.build = "1G"
ram.runtime = "128M"

[install.domain]
type = "domain"

[resources.sources.main]
url = "https://codeload.github.com/WebDecoy/FCaptcha/tar.gz/refs/tags/v1.52.0"
sha256 = "ae5c2c327d8a8fd41355394b1e86deb53bc7a525a16c8ea95a68a44354b6b781"

[resources.go]
version = "1.27.4"

[resources.system_user]

[resources.install_dir]

[resources.data_dir]

[resources.permissions]
main.url = "/"
main.allowed = "visitors"
main.protected = true

[resources.ports]
